name: Night mode guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-mode-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Protect night mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify night mode and exercise regression detection
        run: |
          python3 scripts/check-night-mode.py
          python3 scripts/test-check-night-mode.py -v
